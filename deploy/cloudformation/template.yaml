AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS 研修管理システム - 方式1: CloudFormation による一括デプロイ
  （VPC / パブリック・プライベートサブネット / RDS for PostgreSQL / EC2 + nginx + Node.js）

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: '基本設定' }
        Parameters: [ProjectName, GitRepoUrl, GitBranch]
      - Label: { default: 'EC2 設定' }
        Parameters: [InstanceType, KeyName, SshAllowedCidr, LatestAmiId, InstallCodeDeployAgent]
      - Label: { default: 'RDS 設定' }
        Parameters: [DBEngineVersion, DBInstanceClass, DBName, DBUsername]
    ParameterLabels:
      ProjectName: { default: 'プロジェクト名（リソース名の接頭辞）' }
      GitRepoUrl: { default: 'アプリの Git リポジトリ URL（公開リポジトリ）' }
      GitBranch: { default: 'デプロイするブランチ' }
      InstanceType: { default: 'EC2 インスタンスタイプ' }
      KeyName: { default: 'SSH キーペア名（空欄なら SSH 無効。Session Manager で接続）' }
      SshAllowedCidr: { default: 'SSH を許可する接続元 CIDR' }
      LatestAmiId: { default: 'AMI（Amazon Linux 2023 最新版）' }
      InstallCodeDeployAgent: { default: 'CodeDeploy エージェントをインストールするか（方式3で再利用する場合 true）' }
      DBEngineVersion: { default: 'PostgreSQL メジャーバージョン' }
      DBInstanceClass: { default: 'RDS インスタンスクラス' }
      DBName: { default: 'データベース名' }
      DBUsername: { default: 'RDS マスターユーザー名' }

Parameters:
  ProjectName:
    Type: String
    Default: aws-training
    AllowedPattern: '^[a-z][a-z0-9-]{2,30}$'
  GitRepoUrl:
    Type: String
    Description: '例: https://github.com/your-org/aws-training-admin.git'
  GitBranch:
    Type: String
    Default: main
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t2.micro]
  KeyName:
    Type: String
    Default: ''
  SshAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: '研修では自分のグローバル IP/32 に絞ることを推奨'
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  InstallCodeDeployAgent:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DBEngineVersion:
    Type: String
    Default: '16'
    AllowedValues: ['15', '16', '17']
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t3.micro, db.t4g.small]
  DBName:
    Type: String
    Default: aws_training
    AllowedPattern: '^[a-z][a-z0-9_]{0,62}$'
  DBUsername:
    Type: String
    Default: dbadmin
    AllowedPattern: '^[a-z][a-z0-9_]{0,15}$'

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  UseCodeDeploy: !Equals [!Ref InstallCodeDeployAgent, 'true']

Resources:
  # ------------------------------------------------------------
  # ネットワーク
  # ------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-igw' }]

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-1' }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-2' }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private-1' }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private-2' }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-public-rt' }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # プライベートサブネットはインターネットへの経路を持たない（RDS 専用）
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-private-rt' }]

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ------------------------------------------------------------
  # セキュリティグループ
  # ------------------------------------------------------------
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web server (HTTP from internet)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-web-sg' }]

  WebSshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasKeyName
    Properties:
      GroupId: !Ref WebSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshAllowedCidr
      Description: SSH

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL (only from web server)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref WebSecurityGroup
          Description: PostgreSQL from web server
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-db-sg' }]

  # ------------------------------------------------------------
  # シークレット（パスワードは自動生成し Secrets Manager で管理）
  # ------------------------------------------------------------
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${ProjectName} RDS master user'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  AppAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub '${ProjectName} 管理画面の初期管理者アカウント'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 16
        ExcludePunctuation: true

  # ------------------------------------------------------------
  # RDS for PostgreSQL
  # ------------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${ProjectName} private subnets'
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  DBInstance:
    Type: AWS::RDS::DBInstance
    # 研修用のため、スタック削除時にスナップショットを残さず削除する
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DBName
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-db' }]

  DBSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

  # ------------------------------------------------------------
  # EC2（IAM ロール: Session Manager 接続 + シークレット読み取り）
  # ------------------------------------------------------------
  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns: !If
        - UseCodeDeploy
        - - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
          - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforAWSCodeDeploy
        - - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-app-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DBSecret, !Ref AppAdminSecret]

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WebServerRole]

  WebServer:
    Type: AWS::EC2::Instance
    DependsOn: [PublicDefaultRoute, DBSecretAttachment]
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds: [!Ref WebSecurityGroup]
      IamInstanceProfile: !Ref WebServerInstanceProfile
      Tags:
        - { Key: Name, Value: !Sub '${ProjectName}-web' }
        - { Key: Project, Value: !Ref ProjectName }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # ===== 方式1: CloudFormation による自動セットアップ =====
          # ※ シークレットがログに残らないよう set -x は使わない
          set -euo pipefail
          exec > >(tee -a /var/log/aws-training-setup.log) 2>&1

          signal() {
            /opt/aws/bin/cfn-signal -e "$1" --stack '${AWS::StackName}' --resource WebServer --region '${AWS::Region}' || true
          }
          dnf install -y git jq aws-cfn-bootstrap
          trap 'signal 1' ERR

          # 1. ソース取得
          rm -rf /opt/aws-training
          git clone --depth 1 -b '${GitBranch}' '${GitRepoUrl}' /opt/aws-training

          # 2. ミドルウェアのインストール（Node.js / nginx / psql）
          bash /opt/aws-training/deploy/scripts/install-packages.sh
          if [ '${InstallCodeDeployAgent}' = 'true' ]; then
            bash /opt/aws-training/deploy/scripts/install-codedeploy-agent.sh
          fi

          # 3. Secrets Manager から接続情報を取得し、環境変数ファイルを作成
          DB_SECRET=$(aws secretsmanager get-secret-value --region '${AWS::Region}' --secret-id '${DBSecret}' --query SecretString --output text)
          ADMIN_SECRET=$(aws secretsmanager get-secret-value --region '${AWS::Region}' --secret-id '${AppAdminSecret}' --query SecretString --output text)
          cat > /etc/aws-training/app.env <<EOF
          PORT=3000
          NODE_ENV=production
          SESSION_SECRET=$(openssl rand -hex 32)
          DEPLOY_METHOD=cloudformation
          DB_HOST=${DBInstance.Endpoint.Address}
          DB_PORT=${DBInstance.Endpoint.Port}
          DB_USER=$(echo "$DB_SECRET" | jq -r .username)
          DB_PASSWORD=$(echo "$DB_SECRET" | jq -r .password)
          DB_NAME=${DBName}
          DB_SSL=true
          DB_SSL_CA=/etc/aws-training/rds-ca.pem
          ADMIN_USERNAME=$(echo "$ADMIN_SECRET" | jq -r .username)
          ADMIN_PASSWORD=$(echo "$ADMIN_SECRET" | jq -r .password)
          EOF

          # 4. アプリ配置・DB 初期化・起動・ヘルスチェック
          bash /opt/aws-training/deploy/scripts/install-app.sh /opt/aws-training

          signal 0

Outputs:
  AppUrl:
    Description: 管理システムの URL
    Value: !Sub 'http://${WebServer.PublicDnsName}/'
  AdminSecretConsoleUrl:
    Description: 初期管理者のユーザー名・パスワード（Secrets Manager で「シークレットの値を取得」）
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/secretsmanager/secret?name=${AppAdminSecret}&region=${AWS::Region}'
  DBEndpoint:
    Description: RDS エンドポイント
    Value: !GetAtt DBInstance.Endpoint.Address
  DBSecretArn:
    Description: RDS マスターユーザーのシークレット ARN
    Value: !Ref DBSecret
  WebServerInstanceId:
    Description: EC2 インスタンス ID（Session Manager で接続可能）
    Value: !Ref WebServer
  SessionManagerCommand:
    Description: AWS CLI から EC2 に接続するコマンド
    Value: !Sub 'aws ssm start-session --target ${WebServer} --region ${AWS::Region}'

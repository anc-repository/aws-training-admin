# /etc/nginx/nginx.conf （Amazon Linux 2023 用）
#   標準の nginx.conf にはデフォルトの server ブロックが含まれ、アプリの設定と競合するため、
#   server ブロックを持たないこのファイルで置き換えます。
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens       off;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # アプリケーションごとの設定は conf.d 配下に配置
    include /etc/nginx/conf.d/*.conf;
}

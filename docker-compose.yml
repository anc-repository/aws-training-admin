# ローカル開発用 PostgreSQL（RDS for PostgreSQL 16 相当）
#   起動: docker compose up -d
#   その後: cp .env.example .env && npm run db:init && npm run dev
services:
  postgres:
    image: postgres:16
    container_name: aws-training-postgres
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: aws_training
      TZ: Asia/Tokyo
    ports:
      # ホスト側で既に PostgreSQL が 5432 を使用している場合: PG_PORT=15432 docker compose up -d
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  pg-data:
